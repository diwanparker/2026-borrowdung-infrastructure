version: '3.8'

services:
  backend:
    build:
      context: ../2026-borrowdung-backend
      dockerfile: Dockerfile
    container_name: borrowdung-backend
    ports:
      - "5240:5240"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/BorrowdungDB.db
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ../2026-borrowdung-frontend
      dockerfile: Dockerfile
    container_name: borrowdung-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
